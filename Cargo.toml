[package]
name = "openai-tts-bridge"
version = "0.2.0"
edition = "2024"
authors = ["Kenji Minoura <minoru@kandj.org>", "Nina <nina@kandj.org>"]
description = "High-performance Rust bridge providing an OpenAI-compatible TTS API for multiple engines (Zonos 2, Irodori-TTS)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
regex = "1.11"
byteorder = "1.5"
md5 = "0.7"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
base64 = "0.22"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6.5"
